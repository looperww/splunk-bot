services:
  splunk-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splunk-bot
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
